[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa-backtrack"
version = "0.1.0"
description = "Code for 'Can Transformers Learn to Verify During Backtracking Search?' - Selective State Attention for amortized verification in backtracking search."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "torch",
  "pydantic",
  "pyyaml",
  "transformers>=5.2.0",
  "accelerate>=1.12.0",
  "datasets>=4.5.0",
  "sentencepiece>=0.2.1",
  "protobuf>=6.33.5",
]

[project.optional-dependencies]
sat = ["python-sat>=1.9.dev2"]
llm = ["scikit-learn>=1.3"]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
